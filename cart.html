<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopEasy - Cart & Checkout</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <h2>ShopEasy</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Your Shopping Cart</h2>
        <table id="cartTable">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <h3 style="margin-top: 15px;">Grand Total: <span id="grandTotal">$0.00</span></h3>

        <hr style="margin: 30px 0;">

        <h2>Checkout Form</h2>
        <form id="checkoutForm" novalidate style="max-width: 500px; margin-top: 15px;">
            <div style="margin-bottom: 10px;">
                <label>Full Name:</label><br>
                <input type="text" id="name" style="width: 100%; padding: 8px;">
                <span class="error-msg" id="nameErr"></span>
            </div>
            <div style="margin-bottom: 10px;">
                <label>Email Address:</label><br>
                <input type="email" id="email" style="width: 100%; padding: 8px;">
                <span class="error-msg" id="emailErr"></span>
            </div>
            <div style="margin-bottom: 10px;">
                <label>Phone Number:</label><br>
                <input type="tel" id="phone" style="width: 100%; padding: 8px;">
                <span class="error-msg" id="phoneErr"></span>
            </div>
            <div style="margin-bottom: 10px;">
                <label>City:</label><br>
                <select id="city" style="width: 100%; padding: 8px;">
                    <option value="">-- Select City --</option>
                    <option value="Lahore">Lahore</option>
                    <option value="Karachi">Karachi</option>
                    <option value="Islamabad">Islamabad</option>
                </select>
                <span class="error-msg" id="cityErr"></span>
            </div>
            <div style="margin-bottom: 10px;">
                <label>Address:</label><br>
                <textarea id="address" style="width: 100%; padding: 8px; height: 80px;"></textarea>
                <span class="error-msg" id="addressErr"></span>
            </div>
            <button type="submit" style="padding: 10px 20px;">Place Order</button>
        </form>
    </main>

    <footer style="text-align: center; padding: 15px; margin-top: 30px; background: #ddd;">
        <p>&copy; 2026 ShopEasy Web Store</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
